---
include:
  - project: 'm-team/tools/ci-voodoo'
    ref: 'master'
    file: 'ci-include/generic-ci.yml'
  - project: 'm-team/tools/ci-voodoo'
    ref: 'master'
    file: 'ci-include/pipeline-jobs.yml'
  - project: 'm-team/tools/ci-voodoo'
    ref: 'master'
    file: 'ci-include/pipeline-jobs-publish-to-repo.yml'
  - project: 'm-team/tools/ci-voodoo'
    ref: 'master'
    file: 'ci-include/github-status-sync.yml'

default:
  tags:
    - linux

variables:
  UPSTREAM_PROJECT: dianagudu/motley_cue
  STAGING_BRANCH_NAME: "staging"
  DOCKER_IMAGE_NAMESPACE: "marcvs/build"
  DOCKER_IMAGE_NAME: "universal"
  # MTEAM_CI_ADDITIONAL_PACKAGES_APT: libsasl2-dev libldap2-dev python3-dev
  # MTEAM_CI_ADDITIONAL_PACKAGES_YUM: cyrus-sasl-devel openldap-devel python3-devel
  # MTEAM_CI_ADDITIONAL_PACKAGES_ZYPPER: cyrus-sasl-devel openldap2-devel python3-devel

build-centos-7:
  extends:
    - .build-centos-7
  script:
    - |
      # Force RPM's python-bytecompile script to use python3
      sed "s@^default_python@default_python=python3\n#default_python@" -i /usr/lib/rpm/brp-python-bytecompile
      echo "typing-extensions" >> requirements.txt
    - !reference [.rpm-build-script]
build-ubuntu-bionic:
  extends:
    - .build-ubuntu-bionic
  script:
    - |
      cat debian/rules \
      | sed s/"dh_virtualenv --python python3"/"dh_virtualenv --python python3.8"/ \
      > debian/new-rules
      cat debian/new-rules > debian/rules
      make debsource
      dpkg-buildpackage -uc -us

build-almalinux-8:
  extends:
    - .build-almalinux-8
  allow_failure: true

build-rockylinux-8:
  extends:
    - .build-rockylinux-8
  allow_failure: true

##########################################################################
# Integration (These might to to a central job def)
trigger-integration-tests:
  variables:
    TRIGGER_TOKEN: ${TRIGGER_TOKEN_OIDC_SSH_MOTLEY_CUE}
    API_TOKEN: ${API_TOKEN_OIDC_SSH_MOTLEY_CUE}
    # api token needs "read_api" privileges of developer
  extends:
    - .trigger-integration-tests-ssh-oidc

 






























 
 
 
 
 
 
 
 
 
 
 
 
 
