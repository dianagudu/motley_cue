[tox]
minversion = 4.0.0
envlist = pylint,py{310,311,312,313,314,315},pyright,black,docs,coverage
skipsdist = True
skip_missing_interpreters = True

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312, pylint, black, pyright, coverage
    3.13: py313
    3.14: py314
    3.15: py315

[base]
deps = -r requirements.txt
module = motley_cue

[testenv]
deps =
       {[base]deps}
       -r test-requirements.txt
passenv =
       MC_*
       ACCESS_TOKEN
       OIDC
       OS_ACCESS_TOKEN
       OIDC_ACCESS_TOKEN
       OIDC_AGENT_ACCOUNT
       OIDC_SOCK
commands =
       pytest

[testenv:py312]
commands =
       pytest --cov={[base]module} --cov-report=term-missing:skip-covered
       coverage lcov

[testenv:py314]
commands =
       pytest --cov={[base]module} --cov-report=term-missing:skip-covered
       coverage lcov

[testenv:coverage]
deps =
       {[testenv]deps}
       coverage-badge
commands =
       ; pytest -v --cov={[base]module} --cov-append --cov-report=term-missing
       ; pytest --cov={[base]module} --cov-report=term-missing:skip-covered
       coverage-badge -f -o coverage.svg
       coverage report
       coverage html

[testenv:pylint]
deps =
       {[base]deps}
       pylint
commands = pylint --exit-zero {[base]module}

[testenv:black]
deps = black
commands = black --check --diff -l 100 {[base]module}

[testenv:pyright]
deps =
       {[base]deps}
       pyright
commands = pyright {[base]module}


[testenv:docs]
deps =
       {[base]deps}
       -r doc/source/requirements.txt
commands = sphinx-build doc/source doc/build
