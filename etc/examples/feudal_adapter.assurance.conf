## EXAMPLE feudalAdapter configuration mapping assurance shell tiers to shells.
##
## Pairs with motley_cue.assurance.conf -- see README.md in this directory.
## motley_cue evaluates the tier and passes it in the deploy request; feudal maps
## the tier to one of the shells below.
##
## NB: feudalAdapter's ConfigParser does NOT support inline comments, so every
## comment here is on its own line.
##
## The shipped /etc/motley_cue/feudal_adapter.conf already contains the same
## shell_* settings; they are repeated here so this file works standalone.
##
## The tiers are only applied by the local_unix backend. The same shells would
## work for the ldap backends, but there the shell path is written into the
## directory and must exist on every target login system, not just on the host
## running motley_cue.

[ldf_adapter]
backend = local_unix

[backend.local_unix]
# tier: full (also the default when tiers are not enabled)
shell = /bin/bash
# tier: limited -- restricted shell exposing only a safe command subset
shell_limited = /etc/motley_cue/shells/mc-rbash
# tier: restricted -- prints a message and exits
shell_restricted = /etc/motley_cue/shells/mc-message
