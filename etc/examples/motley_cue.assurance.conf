## EXAMPLE motley_cue configuration with assurance-based shell tiers ENABLED.
##
## For functional testing / reference. Point motley_cue at this file via
## MOTLEY_CUE_CONFIG, paired with feudal_adapter.assurance.conf via
## FEUDAL_ADAPTER_CONFIG. See README.md in this directory.
##
## The default /etc/motley_cue/motley_cue.conf ships tiers OFF (every user gets
## the full shell). This example turns them ON so the feature can be exercised.

[mapper]
log_level = INFO

[DEFAULT]
## Assurance policy for every OP below. Any OP can override any of these in its
## own [authorisation.*] section -- see [authorisation.no-mfa] at the bottom.
##
## MFA + cappuccino  -> full       (interactive shell)
## cappuccino only   -> limited    (restricted shell)
## everything else   -> restricted (message-and-exit shell)
assurance_based_shell_tier_full = https://refeds.org/profile/mfa & assurance/profile/cappuccino
assurance_based_shell_tier_limited = assurance/profile/cappuccino
assurance_based_shell_tier_restricted = *
## The default tier is only consulted if no expression matches; here "*" always
## matches, so it is never used. Left at its default ("full").
# assurance_based_shell_default_tier = full
##
## Claims searched for assurance values, and the prefix relative values expand
## with. Left at their defaults here.
# assurance_prefix = https://refeds.org
# assurance_claims = [assurance, eduperson_assurance, acr]

## Authorise the OP you test against. `authorise_all` lets any user of this OP
## in, so the assurance TIER -- not authorisation -- decides the shell.
## Replace op_url with your test OP.
[authorisation.test]
op_url = https://op.example/
authorise_all = True

## Same policy, but this OP cannot assert MFA, so nobody from it reaches the
## full tier. One line, instead of restating the expressions.
[authorisation.no-mfa]
op_url = https://other-op.example/
authorise_all = True
assurance_based_shell_max_tier = limited
