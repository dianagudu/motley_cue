## EXAMPLE motley_cue configuration with assurance-based shell tiers ENABLED.
##
## For functional testing / reference. Point motley_cue at this file via
## MOTLEY_CUE_CONFIG, paired with feudal_adapter.assurance.conf via
## FEUDAL_ADAPTER_CONFIG. See README.md in this directory.
##
## The default /etc/motley_cue/motley_cue.conf ships tiers OFF (every user gets
## the full shell). This example turns them ON so the feature can be exercised.

[mapper]
log_level = INFO

[assurance]
## MFA + cappuccino  -> full       (interactive shell)
## cappuccino only   -> limited    (restricted shell)
## everything else   -> restricted (message-and-exit shell)
tier_full = https://refeds.org/profile/mfa & profile/cappuccino
tier_limited = profile/cappuccino
tier_restricted = *
## default_tier is only consulted if no expression matches; here "*" always
## matches, so it is never used. Left at its default ("full").
# default_tier = full

## Authorise the OP you test against. `authorise_all` lets any user of this OP
## in, so the assurance TIER -- not authorisation -- decides the shell.
## Replace op_url with your test OP.
[authorisation.test]
op_url = https://op.example/
authorise_all = True
## Optionally cap this OP's tier, e.g. for an OP that cannot assert MFA:
# max_tier = limited
